name: MatchTalent DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    name: 🔍 SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: 📦 SCA - Trivy (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

  dast:
    name: 🌐 DAST - OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install & Start All Services
        run: |
          # 1. Start AI Service (FastAPI)
          cd ${{ github.workspace }}/aiServices 
          pip install -r requirements.txt
          # Explicitly bind to 127.0.0.1 to avoid IPv6/IPv4 Docker confusion
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          
          # 2. Start the Backend (Node)
          cd ${{ github.workspace }}/backend
          npm install
          npm start &
          
          # 3. Start the Frontend (Vite)
          cd ${{ github.workspace }}/frontend
          npm install
          npm run dev -- --port 3000 &
          
          # SMART WAIT: Wait for the AI service OpenAPI endpoint to be fully ready (Timeout after 3 minutes)
          echo "Waiting for AI Service to start up and serve OpenAPI spec..."
          timeout 180 bash -c 'until curl -f -s http://127.0.0.1:8000/openapi.json > /dev/null; do echo "Waiting for AI API..."; sleep 5; done'
          echo "AI Service is up and running!"
          
          # SMART WAIT: Wait for the Frontend to be fully ready
          timeout 60 bash -c 'until curl -f -s http://127.0.0.1:3000 > /dev/null; do echo "Waiting for frontend..."; sleep 5; done'
          echo "Frontend is up and running!"
          
      - name: ZAP Baseline Scan (Frontend)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:3000'
          fail_action: false
          allow_issue_writing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up previous ZAP reports
        run: sudo rm -f report_json.json report_md.md report_html.html

      - name: ZAP API Scan (AI Service)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: openapi
          target: 'http://127.0.0.1:8000/openapi.json'
          fail_action: false
          artifact_name: 'zap_api_scan'

  secret-scan:
    name: 🔑 Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified